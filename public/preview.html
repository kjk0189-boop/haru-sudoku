<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#293e5f">
  <title>하루 스도쿠 · 모바일 미리보기</title>
  <style>
    @font-face{font-family:Pretendard;src:url('./fonts/Pretendard-Regular.subset.woff2') format('woff2');font-weight:400;font-display:swap}
    *{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,sans-serif;background:#f1f3f6;color:#293e5f}
    header{display:flex;align-items:center;justify-content:space-between;max-width:920px;margin:0 auto;padding:23px 28px;font-size:14px;gap:20px}
    header p{font-size:12px;color:#707b8b;margin:7px 0 0;line-height:1.7}a{color:inherit;text-underline-offset:4px;white-space:nowrap;font-size:12px}
    main{display:flex;justify-content:center;padding:8px 20px 28px}
    .phone{width:392px;height:min(844px,calc(100dvh - 136px));min-height:568px;border:1px solid #cbd2dd;border-radius:24px;background:#fff;overflow:hidden;box-shadow:0 12px 36px #293e5f0d}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:600px){header{display:none}main{padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header><div><span id="preview-title">하루 스도쿠 · 모바일 미리보기</span><p id="preview-description">앱과 같은 모바일 화면입니다. 설치 없이 바로 플레이할 수 있어요.</p></div><a id="preview-fullscreen" href="./" target="_top">전체 화면으로 보기</a></header>
  <main><div class="phone"><iframe id="preview-game" src="./" title="하루 스도쿠 모바일 게임"></iframe></div></main>
  <script>
    function updateLanguage() {
      let english = false;
      try { english = localStorage.getItem('haru-sudoku:language:v1') === 'en'; } catch {}
      document.documentElement.lang = english ? 'en' : 'ko';
      const title = english ? 'Haru Sudoku · Mobile preview' : '하루 스도쿠 · 모바일 미리보기';
      document.title = title;
      document.getElementById('preview-title').textContent = title;
      document.getElementById('preview-description').textContent = english ? 'Play the mobile app interface here. No installation needed.' : '앱과 같은 모바일 화면입니다. 설치 없이 바로 플레이할 수 있어요.';
      document.getElementById('preview-fullscreen').textContent = english ? 'Open full screen' : '전체 화면으로 보기';
      document.getElementById('preview-game').title = english ? 'Haru Sudoku mobile game' : '하루 스도쿠 모바일 게임';
    }
    updateLanguage();
    window.addEventListener('storage', event => {
      if (event.key === 'haru-sudoku:language:v1' || event.key === null) updateLanguage();
    });
  </script>
</body>
</html>
